<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlorDiaria</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #060913;
            color: #f3f4f6;
            font-family: 'Lora', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Fondo de estrellas sutil */
        .constellation-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.7) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.2;
            z-index: 1;
        }

        /* SVG de Constelación de fondo - Visible y brillante */
        .constellation-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .constellation-svg path {
            stroke: rgba(255, 255, 255, 0.65);
            stroke-width: 2;
            fill: none;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
        }

        .constellation-svg circle {
            fill: #ffffff;
            stroke: rgba(255, 255, 255, 0.8);
            stroke-width: 1.5;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
        }

        /* Botón de Música */
        .music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #f87171;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }

        .music-btn:hover {
            background-color: #ef4444;
        }

        /* Tarjeta Central */
        .card {
            background-color: #12151f;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            z-index: 10;
            position: relative;
        }

        .date {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            color: #d4b28c;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: #f87171;
            margin-bottom: 20px;
        }

        .flower-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: inline-block;
        }

        .flower-title {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            color: #f87171;
            margin-bottom: 15px;
        }

        .quote {
            font-style: italic;
            font-size: 1rem;
            line-height: 1.6;
            color: #e5e7eb;
        }
    </style>
</head>
<body>

    <div class="constellation-bg"></div>
    
    <!-- Contenedor para la constelación del día -->
    <div id="constellation-container"></div>

    <!-- Botón de Música -->
    <button class="music-btn" id="musicToggle">Música</button>

    <!-- Elemento de Audio -->
    <audio id="bgAudio" loop>
        <source src="cancion.mp3" type="audio/mp3">
        Tu navegador no soporta audio.
    </audio>

    <!-- Tarjeta Principal -->
    <div class="card">
        <div class="date" id="currentDate">SÁBADO, 19 DE SEPTIEMBRE DE 2026</div>
        <h1 class="title">FlorDiaria</h1>
        <div class="flower-icon" id="flowerIcon">🌿</div>
        <div class="flower-title" id="flowerTitle">Planta de Hogar de Verano</div>
        <p class="quote" id="flowerQuote">"Disfruta de la magia de la paz profunda de un corazón que ama sin medida, y que este día te devolverá el doble de lo bueno que das."</p>
    </div>

    <script>
        // --- 1. Lógica de Música ---
        const musicBtn = document.getElementById('musicToggle');
        const bgAudio = document.getElementById('bgAudio');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                bgAudio.pause();
                musicBtn.textContent = 'Música';
                musicBtn.style.backgroundColor = '#f87171';
            } else {
                bgAudio.play().then(() => {
                    musicBtn.textContent = 'Pausar';
                    musicBtn.style.backgroundColor = '#10b981';
                }).catch(e => {
                    console.log("Error al reproducir audio:", e);
                });
            }
            isPlaying = !isPlaying;
        });

        // --- 2. Constelaciones y Contenido Dinámico por Día de la Semana ---
        const daysData = [
            { // Domingo
                constellationSvg: `<svg class="constellation-svg" viewBox="0 0 1000 1000"><path d="M150,200 L300,150 L450,250 L600,180" /><circle cx="150" cy="200" r="4"/><circle cx="300" cy="150" r="5"/><circle cx="450" cy="250" r="4"/><circle cx="600" cy="180" r="5"/></svg>`,
                flower: "🌸", name: "Flor de Cerezo Silvestre", quote: "Cada amanecer contigo es un lienzo en blanco listo para llenarse de colores hermosos."
            },
            { // Lunes
                constellationSvg: `<svg class="constellation-svg" viewBox="0 0 1000 1000"><path d="M200,800 L350,650 L500,750 L650,600" /><circle cx="200" cy="800" r="4"/><circle cx="350" cy="650" r="5"/><circle cx="500" cy="750" r="4"/><circle cx="650" cy="600" r="5"/></svg>`,
                flower: "🌹", name: "Rosa Mística de Otoño", quote: "Que el inicio de esta semana refleje la fuerza y la elegancia de un amor sincero."
            },
            { // Martes
                constellationSvg: `<svg class="constellation-svg" viewBox="0 0 1000 1000"><path d="M800,150 L650,300 L750,450 L600,600" /><circle cx="800" cy="150" r="5"/><circle cx="650" cy="300" r="4"/><circle cx="750" cy="450" r="5"/><circle cx="600" cy="600" r="4"/></svg>`,
                flower: "🌻", name: "Girasol de los Deseos", quote: "Busca siempre la luz que alegra tus días, tal como las flores buscan el sol."
            },
            { // Miércoles
                constellationSvg: `<svg class="constellation-svg" viewBox="0 0 1000 1000"><path d="M100,400 L250,350 L400,450 L550,300" /><circle cx="100" cy="400" r="4"/><circle cx="250" cy="350" r="4"/><circle cx="400" cy="450" r="5"/><circle cx="550" cy="300" r="5"/></svg>`,
                flower: "🌷", name: "Tulipán de la Aurora", quote: "A mitad de semana, recuerda que cada pequeño detalle cultiva grandes momentos a tu lado."
            },
            { // Jueves
                constellationSvg: `<svg class="constellation-svg" viewBox="0 0 1000 1000"><path d="M700,200 L550,350 L400,250 L250,400" /><circle cx="700" cy="200" r="5"/><circle cx="550" cy="350" r="4"/><circle cx="400" cy="250" r="4"/><circle cx="250" cy="400" r="5"/></svg>`,
                flower: "🌺", name: "Hibisco Tropical", quote: "La belleza de la vida se esconde en las sonrisas compartidas y la paz del alma."
            },
            { // Viernes
                constellationSvg: `<svg class="constellation-svg" viewBox="0 0 1000 1000"><path d="M300,100 L450,250 L600,150 L750,300" /><circle cx="300" cy="100" r="5"/><circle cx="450" cy="250" r="4"/><circle cx="600" cy="150" r="5"/><circle cx="750" cy="300" r="4"/></svg>`,
                flower: "🌼", name: "Margarita de los Sueños", quote: "El fin de semana llega para recordarnos la magia de descansar y disfrutar lo simple."
            },
            { // Sábado (Hoy)
                constellationSvg: `<svg class="constellation-svg" viewBox="0 0 1000 1000"><path d="M180,180 L500,320 L820,180 M500,320 L200,820 L800,820" /><circle cx="180" cy="180" r="5"/><circle cx="500" cy="320" r="6"/><circle cx="820" cy="180" r="5"/><circle cx="200" cy="820" r="5"/><circle cx="800" cy="820" r="5"/></svg>`,
                flower: "🌿", name: "Planta de Hogar de Verano", quote: "Disfruta de la magia de la paz profunda de un corazón que ama sin medida, y que este día te devolverá el doble de lo bueno que das."
            }
        ];

        // Obtener el día actual (0 = Domingo, 1 = Lunes, ..., 6 = Sábado)
        const today = new Date().getDay();
        const currentDayData = daysData[today];

        // Inyectar la constelación correspondiente
        document.getElementById('constellation-container').innerHTML = currentDayData.constellationSvg;

        // Inyectar la flor y mensaje del día
        document.getElementById('flowerIcon').textContent = currentDayData.flower;
        document.getElementById('flowerTitle').textContent = currentDayData.name;
        document.getElementById('flowerQuote').textContent = `"${currentDayData.quote}"`;

        // Formatear fecha actual legible
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const formattedDate = new Date().toLocaleDateString('es-ES', options).toUpperCase();
        document.getElementById('currentDate').textContent = formattedDate;
    </script>
</body>
</html>
