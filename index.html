<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlorDiaria</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #f0f0f0;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background-color: #1e1e1e;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
            margin: 20px;
        }
        .date-badge {
            color: #d4a373;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        h1 {
            color: #e06d77;
            font-size: 1.8rem;
            margin: 8px 0;
        }
        .flower {
            font-size: 3.2rem;
            margin: 10px 0;
        }
        .flower-name {
            font-size: 1rem;
            color: #e06d77;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .quote {
            font-style: italic;
            color: #ccc;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        #music-btn {
            background-color: #e06d77;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Reproductor de música -->
    <audio id="bg-music" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>
    
    <button id="music-btn" onclick="toggleMusic()" style="position: fixed; top: 15px; right: 15px; z-index: 9999;">Música</button>

    <div class="card">
        <div class="date-badge" id="date">Cargando...</div>
        <h1>FlorDiaria</h1>
        <div class="flower" id="flower">🌱</div>
        <div class="flower-name" id="flower-name">Semilla de Vida</div>
        <div class="quote-container">
            <p class="quote" id="quote">"Cargando tu frase motivadora del día..."</p>
        </div>
    </div>

    <script>
        function toggleMusic() {
            var music = document.getElementById("bg-music");
            var btn = document.getElementById("music-btn");
            if (music.paused) {
                music.play();
                btn.innerText = "Pausar";
            } else {
                music.pause();
                btn.innerText = "Música";
            }
        }

        // Catálogo base de íconos y nombres botánicos
        const baseFlores = [
            { f: "🌱", n: "Semilla de Vida" }, { f: "🌻", n: "Girasol Radiante" }, { f: "🌷", n: "Tulipán Silvestre" }, 
            { f: "🌹", n: "Rosa Apasionada" }, { f: "🌺", n: "Hibisco Tropical" }, { f: "🌸", n: "Flor de Cerezo" }, 
            { f: "🌼", n: "Margarita de la Paz" }, { f: "💐", n: "Ramo de Cariño" }, { f: "💮", n: "Flor Blanca del Alma" }, 
            { f: "🍀", n: "Trébol de Buena Suerte" }, { f: "🌿", n: "Brote de Esperanza" }, { f: "🌵", n: "Cactus Resiliente" },
            { f: "🌷", n: "Tulipán Rosa" }, { f: "🌻", n: "Girasol de Verano" }, { f: "🌹", n: "Rosa de Enero" }, 
            { f: "🌸", n: "Flor de Primavera" }, { f: "🌺", n: "Hibisco Silvestre" }, { f: "🌼", n: "Margarita Dorada" },
            { f: "🪷", n: "Loto Sagrado" }, { f: "🪻", n: "Jacinto Silencioso" }, { f: "🍁", n: "Hoja de Otoño" },
            { f: "🌾", n: "Espiga Dorada" }, { f: "🪴", n: "Planta de Hogar" }, { f: "🍂", n: "Hoja Seca Nostálgica" }
        ];

        // Catálogo base de componentes para estructurar frases infinitamente variadas
        const inicios = [
            "Cada amanecer trae consigo", "Recuerda siempre que", "Hoy es el día perfecto para", 
            "Confía plenamente en que", "Abre tu corazón para", "No olvides nunca que", 
            "Permítete sentir hoy", "Guarda en tu mente que", "La vida nos regala", 
            "Camina hoy sabiendo que", "Disfruta de la magia de", "Abraza con fuerza"
        ];
        const centros = [
            " la maravillosa capacidad de transformar tus sueños,", " la valentía inquebrantable para superar cualquier reto,", 
            " la hermosa tranquilidad de ser tú mism@,", " el arte de cultivar la alegría en los pequeños detalles,", 
            " la fuerza para florecer incluso en los días grises,", " la magia de una sonrisa sincera en el momento indicado,", 
            " la calma que llega cuando dejas ir lo innecesario,", " el brillo propio que ilumina cada paso que das,",
            " la paz profunda de un corazón que ama sin medida,", " la esperanza que brota con la luz de la mañana,"
        ];
        const finales = [
            " y alcanzar todo aquello que te propones con el corazón.", " dejando una huella imborrable a tu alrededor.", 
            " porque mereces toda la paz y el amor del mundo.", " disfrutando plenamente del presente y construyendo tu destino.", 
            " con esa elegancia y fortaleza que te caracterizan.", " sabiendo que cada esfuerzo tuyo vale la pena.", 
            " y que este día te devolverá el doble de lo bueno que das.", " para hacer de hoy un recuerdo inolvidable.",
            " llenando cada espacio de armonía y bienestar.", " con la certeza de que lo mejor está por venir."
        ];

        // Función matemática determinista para garantizar exactamente 365 resultados únicos distribuidos por día del año
        function generar365(diaDelAnio) {
            // Seleccionar flor única para el día
            const idxFlor = (diaDelAnio * 37) % baseFlores.length;
            const florElegida = baseFlores[idxFlor];

            // Modificar ligeramente el nombre según la época del año para darle distinción
            let nombreFinal = florElegida.n;
            if (diaDelAnio > 90 && diaDelAnio < 180) nombreFinal += " de Primavera";
            else if (diaDelAnio >= 180 && diaDelAnio < 270) nombreFinal += " de Verano";
            else if (diaDelAnio >= 270 && diaDelAnio < 355) nombreFinal += " de Otoño";
            else nombreFinal += " de Invierno";

            // Combinar componentes para crear una frase única y distinta para este día exacto
            const i = (diaDelAnio * 13) % inicios.length;
            const c = (diaDelAnio * 29) % centros.length;
            const f = (diaDelAnio * 43) % finales.length;

            const fraseElegida = `"${inicios[i]}${centros[c]}${finales[f]}"`;

            return {
                flor: florElegida.f,
                nombre: nombreFinal,
                frase: fraseElegida
            };
        }

        window.addEventListener("DOMContentLoaded", () => {
            const ahora = new Date();
            const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let fechaTexto = ahora.toLocaleDateString('es-ES', opcionesFecha);
            fechaTexto = fechaTexto.charAt(0).toUpperCase() + fechaTexto.slice(1);
            
            document.getElementById("date").innerText = fechaTexto;

            // Calcular el número exacto del día del año (1 al 365)
            const inicioAnio = new Date(ahora.getFullYear(), 0, 0);
            const diff = (ahora - inicioAnio) + ((inicioAnio.getTimezoneOffset() - ahora.getTimezoneOffset()) * 60 * 1000);
            const unDiaMilisegundos = 1000 * 60 * 60 * 24;
            const diaDelAnio = Math.floor(diff / unDiaMilisegundos);

            // Obtener la flor y la frase de los 365 días correspondientes a hoy
            const datosHoy = generar365(diaDelAnio);

            document.getElementById("flower").innerText = datosHoy.flor;
            document.getElementById("flower-name").innerText = datosHoy.nombre;
            document.getElementById("quote").innerText = datosHoy.frase;
        });
    </script>
</body>
</html>
