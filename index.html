<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlorDiaria</title>
  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22:%22FlorDiaria%22,
    %22short_name%22:%22FlorDiaria%22,
    %22start_url%22:%22.%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22%23121212%22,
    %22theme_color%22:%22%23121212%22,
    %22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}]
  }">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --accent: #ff758c;
      --subtext: #aaaaaa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      max-width: 380px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .date-badge {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--subtext);
      margin-bottom: 8px;
    }
    h1 {
      margin: 0 0 15px 0;
      font-size: 26px;
      color: var(--accent);
      font-weight: 700;
    }
    .flower {
      font-size: 90px;
      margin: 20px 0;
      display: inline-block;
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .flower-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 15px;
    }
    .quote-container {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    p.quote {
      font-size: 17px;
      line-height: 1.6;
      font-style: italic;
      margin: 0;
      color: #e0e0e0;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="date-badge" id="date">Cargando...</div>
    <h1>FlorDiaria</h1>
    <div class="flower" id="flower">🌸</div>
    <div class="flower-name" id="flower-name">Flor del día</div>
    
    <div class="quote-container">
      <p class="quote" id="quote">"Cargando tu frase motivadora del día..."</p>
    </div>
  </div>

  <script>
    const flores = [
      { flor: "🌻", nombre: "Girasol" },
      { flor: "🌸", nombre: "Flor de Cerezo" },
      { flor: "🌹", nombre: "Rosa Roja" },
      { flor: "🌷", nombre: "Tulipán" },
      { flor: "🌺", nombre: "Hibisco" },
      { flor: "🪷", nombre: "Flor de Loto" },
      { flor: "🌼", nombre: "Margarita" },
      { flor: "💐", nombre: "Ramillete Silvestre" },
      { flor: "🏵️", nombre: "Roseta Dorada" },
      { flor: "🌿", nombre: "Brote de Primavera" },
      { flor: "🌱", nombre: "Semilla de Vida" },
      { flor: "🌾", nombre: "Espiga Dorada" },
      { flor: "☘️", nombre: "Trébol de la Suerte" },
      { flor: "🥀", nombre: "Rosa Mística" }
    ];

    const iniciosFrases = [
      "Cada amanecer trae consigo", "Recuerda siempre que", "Tu mayor fortaleza radica en",
      "Hoy es el día perfecto para", "Nunca subestimes la fuerza de", "La verdadera belleza comienza con",
      "Confía plenamente en que", "Mantén la fe en que", "El secreto para avanzar es",
      "Abre tu corazón para", "La paciencia y el amor siempre", "Crea hoy tu propio espacio para"
    ];

    const centroFrases = [
      " la capacidad de transformar tus sueños", " la valentía para superar cualquier reto", " la tranquilidad de ser honesto contigo mismo",
      " cultivar la alegría en los pequeños detalles", " florecer incluso en los momentos difíciles", " renovar tu energía con pensamientos positivos",
      " dar lo mejor de ti sin esperar nada a cambio", " aprender de cada paso en el camino", " iluminar la vida de quienes te rodean"
    ];

    const finalesFrases = [
      " y alcanzar lo que te propones.", " con una sonrisa imborrable.", " porque mereces toda la paz del mundo.",
      " y dejar una huella hermosa hoy.", " con elegancia y mucha fuerza.", " permitiendo que tu luz brille sin miedo.",
      " disfrutando plenamente del presente.", " y construir tu propio destino."
    ];

    function obtenerDiaDelAnio(fecha) {
      const inicio = new Date(fecha.getFullYear(), 0, 0);
      const dif = fecha - inicio;
      const unDia = 1000 * 60 * 60 * 24;
      return Math.floor(dif / unDia);
    }

    function actualizarFlorYFrase() {
      const hoy = new Date();
      const diaAnio = obtenerDiaDelAnio(hoy);

      const florIndex = diaAnio % flores.length;
      const inicioIndex = diaAnio % iniciosFrases.length;
      const centroIndex = (diaAnio * 3) % centroFrases.length;
      const finalIndex = (diaAnio * 7) % finalesFrases.length;

      const florDelDia = flores[florIndex];
      const fraseDelDia = `${iniciosFrases[inicioIndex]}${centroFrases[centroIndex]}${finalesFrases[finalIndex]}`;

      const opcionesFecha = { weekday: 'long', month: 'long', day: 'numeric' };
      const fechaTexto = hoy.toLocaleDateString('es-ES', opcionesFecha);

      document.getElementById('date').innerText = fechaTexto;
      document.getElementById('flower').innerText = florDelDia.flor;
      document.getElementById('flower-name').innerText = florDelDia.nombre;
      document.getElementById('quote').innerText = `"${fraseDelDia}"`;
    }

    actualizarFlorYFrase();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('data:text/javascript,console.log("SW cargado");');
    }
  </script>
</body>
</html>
